<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javier National High School - QR Code Attendance Scanner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start p-4 py-8">

  <!-- MAIN SCANNER CONTAINER -->
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 flex flex-col items-center border border-slate-200 mb-6">
    
    <!-- SCHOOL LOGO & HEADER -->
    <div class="mb-3 flex flex-col items-center text-center">
      <img 
        src="logo.jpg" 
        alt="Javier National High School Logo" 
        class="h-20 w-20 object-contain drop-shadow-sm rounded-full border border-slate-100 p-1 mb-2"
        onerror="this.style.display='none'"
      />
      <h1 class="text-xl font-bold text-slate-900 leading-tight">Javier National High School</h1>
      <p class="text-xs font-semibold text-indigo-600 tracking-wide uppercase mt-0.5">Attendance System</p>
    </div>

    <p class="text-xs font-medium text-slate-500 mb-4 uppercase tracking-wider text-center">Cutoff: 7:00 AM | TimeOut: 4:00 PM</p>

    <!-- REAL-TIME DASHBOARD COUNTERS CARD -->
    <div class="w-full grid grid-cols-2 gap-3 mb-4">
      <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-center">
        <p class="text-xs font-semibold text-indigo-600 uppercase">No. of Students</p>
        <p id="counter-present" class="text-lg font-bold text-indigo-900 mt-1">
          <span id="val-present">--</span> / <span id="val-enrolled">--</span>
        </p>
        <p class="text-[10px] text-indigo-500 mt-0.5">Present / Enrolled</p>
      </div>

      <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 text-center">
        <p class="text-xs font-semibold text-rose-600 uppercase">Total Absent</p>
        <p id="val-absent" class="text-lg font-bold text-rose-900 mt-1">--</p>
        <p class="text-[10px] text-rose-500 mt-0.5">Students Absent Today</p>
      </div>
    </div>

    <!-- Camera Viewport Container -->
    <div id="reader" class="w-full bg-black rounded-xl overflow-hidden min-h-[300px] border border-slate-300"></div>

    <!-- Status Alert Display -->
    <div id="status-card" class="w-full mt-5 p-4 rounded-xl text-center hidden transition-all duration-200">
      <h2 id="status-title" class="font-bold text-base"></h2>
      <p id="status-msg" class="text-sm mt-1"></p>
    </div>
  </div>
