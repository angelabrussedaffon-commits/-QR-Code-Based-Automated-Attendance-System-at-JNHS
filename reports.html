<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal - Student Attendance Reports</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start p-4 py-8">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
    
    <!-- HEADER -->
    <div class="flex items-center gap-3 border-b border-slate-100 pb-4 mb-5">
      <img src="logo.jpg" alt="Logo" class="h-12 w-12 object-contain rounded-full border p-0.5" onerror="this.style.display='none'"/>
      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight">Javier National High School</h1>
        <p class="text-xs font-semibold text-indigo-600 uppercase">Faculty Attendance Portal</p>
      </div>
    </div>

    <!-- SEARCH & FILTER SECTION -->
    <div class="space-y-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <!-- Search Input -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Search Student Name or LRN:</label>
        <input 
          type="text" 
          id="searchInput" 
          oninput="filterStudentDropdown()" 
          placeholder="Type student name or LRN..." 
          class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Select Student Dropdown -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Select Student:</label>
        <select id="studentSelect" onchange="loadCalendar()" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">-- Loading Enrolled Students... --</option>
        </select>
      </div>

      <!-- Month & Year Filters -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Month:</label>
          <select id="monthSelect" onchange="loadCalendar()" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11" selected>November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Year:</label>
          <select id="yearSelect" onchange="loadCalendar()" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
          </select>
        </div>
      </div>
    </div>

    <!-- STUDENT REPORT DISPLAY CARD -->
    <div id="reportCard" class="hidden">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
        <div>
          <h2 id="studentName" class="text-base font-bold text-slate-900">--</h2>
          <p id="studentDetails" class="text-xs text-indigo-600 font-semibold">--</p>
        </div>
        <button onclick="window.print()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs px-3 py-1.5 rounded-lg border border-indigo-200 flex items-center gap-1">
          🖨️ Print Report
        </button>
      </div>

      <!-- LEGEND -->
      <div class="flex justify-around items-center bg-slate-50 p-2 rounded-lg border border-slate-200 mb-3 text-[11px] font-semibold">
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> Present</div>
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span> Late</div>
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> Absent</div>
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-200 inline-block"></span> Weekend</div>
      </div>

      <!-- CALENDAR GRID -->
      <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-600 mb-1">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center mb-4"></div>

      <!-- MONTHLY TOTAL COUNTERS -->
      <div class="pt-3 border-t border-slate-100 grid grid-cols-3 gap-2 text-center">
        <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2">
          <p class="text-[10px] font-bold text-emerald-600 uppercase">Present</p>
          <p id="total-present" class="text-base font-extrabold text-emerald-800 mt-0.5">0</p>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-lg p-2">
          <p class="text-[10px] font-bold text-amber-600 uppercase">Late</p>
          <p id="total-late" class="text-base font-extrabold text-amber-800 mt-0.5">0</p>
        </div>

        <div class="bg-rose-50 border border-rose-200 rounded-lg p-2">
          <p class="text-[10px] font-bold text-rose-600 uppercase">Absent</p>
          <p id="total-absent" class="text-base font-extrabold text-rose-800 mt-0.5">0</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3zonPAIDztpcXp-KJ7EF6Q6WzNn6jjCndDf2Vjb4s7v2wy3otFXoCo634MObjE6g/exec";
    let allStudents = [];

    async function fetchStudents() {
      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "GET_STUDENT_LIST" }),
          redirect: "follow"
        });
        const result = await response.json();
        if (result.status === "success" && result.students) {
          allStudents = result.students;
          populateStudentDropdown(allStudents);
        }
      } catch (err) {
        console.error("Failed to fetch student list:", err);
      }
    }

    function populateStudentDropdown(students) {
      const select = document.getElementById("studentSelect");
      select.innerHTML = '<option value="">-- Choose Student --</option>';
      students.forEach(s => {
        select.innerHTML += `<option value="${s.lrn}">${s.name} (LRN: ${s.lrn} | Gr. ${s.grade}-${s.section})</option>`;
      });
    }

    function filterStudentDropdown() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = allStudents.filter(s => 
        s.name.toLowerCase().includes(query) || s.lrn.toLowerCase().includes(query)
      );
      populateStudentDropdown(filtered);
    }

    async function loadCalendar() {
      const lrn = document.getElementById("studentSelect").value;
      const month = parseInt(document.getElementById("monthSelect").value, 10);
      const year = parseInt(document.getElementById("yearSelect").value, 10);
      const reportCard = document.getElementById("reportCard");

      if (!lrn) {
        reportCard.classList.add("hidden");
        return;
      }

      const student = allStudents.find(s => String(s.lrn).trim() === String(lrn).trim());
      if (student) {
        document.getElementById("studentName").innerText = student.name;
        document.getElementById("studentDetails").innerText = `LRN: ${student.lrn} | Grade ${student.grade} - ${student.section}`;
      }

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "GET_STUDENT_CALENDAR", lrn: lrn, month: month, year: year }),
          redirect: "follow"
        });
        const result = await response.json();
        renderCalendarGrid(year, month, result.calendar || {});
        reportCard.classList.remove("hidden");
      } catch (err) {
        alert("Error loading student calendar records.");
      }
    }

    function renderCalendarGrid(year, month, logs) {
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      const firstDay = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const today = new Date();

      let countPresent = 0;
      let countLate = 0;
      let countAbsent = 0;

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="h-8"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month - 1, day);
        const dayOfWeek = dateObj.getDay();
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const status = logs ? logs[day] : undefined;

        let bgClass = "bg-slate-100 text-slate-700";
        let statusLabel = "";

        if (isWeekend) {
          bgClass = "bg-slate-200 text-slate-400";
        } else if (status === "Present") {
          bgClass = "bg-emerald-500 text-white font-bold shadow-sm";
          statusLabel = "P";
          countPresent++;
        } else if (status === "Late") {
          bgClass = "bg-amber-400 text-slate-900 font-bold shadow-sm";
          statusLabel = "L";
          countLate++;
        } else if (dateObj <= today) {
          bgClass = "bg-rose-500 text-white font-bold shadow-sm";
          statusLabel = "A";
          countAbsent++;
        }

        grid.innerHTML += `
          <div class="h-8 flex flex-col items-center justify-center rounded-md text-[11px] ${bgClass}">
            <span>${day}</span>
            ${statusLabel ? `<span class="text-[8px] leading-none opacity-90">${statusLabel}</span>` : ''}
          </div>
        `;
      }

      document.getElementById("total-present").innerText = countPresent;
      document.getElementById("total-late").innerText = countLate;
      document.getElementById("total-absent").innerText = countAbsent;
    }

    fetchStudents();
  </script>
</body>
</html>
